# Global Docker Sandbox defaults: install as ~/.sbxenv.yaml (one per machine, shared by every repo).
# sbx merges it with a repo's sbxenv.yaml when `sbx env create|run` is given no PATH; the repo file
# wins. It cannot set `name`, and its `workspace` may only be the project dir, so leave both to
# the repo file. Lists such as additionalWorkspaces concatenate.
# If the user already has ~/.sbxenv.yaml, merge into it; do not overwrite.
schemaVersion: "1"

# Built-in Claude Code agent: the subscription login held by the sbx proxy works with it.
agent: claude

# ADAPT: tooling shared by the user's repos. Each mount appears at the same path inside (C:\x -> /c/x).
# Never mount a parent folder of a repo that runs in clone mode: it covers the clone.
additionalWorkspaces: []
  # Example:
  # - { path: C:\Users\me\.mytool }                                   # live tool data, read-write
  # - { path: C:\Users\me\agents, readOnly: true }                    # custom agents
  # - { path: C:\Users\me\src\mytool, readOnly: true }                # CLI source + skill

# ADAPT: paths of the mounts above, for the CLIs and for each repo's setup-in-sandbox.sh. No secrets.
env: {}
  # MYTOOL_DB_PATH: /c/Users/me/.mytool/mytool.db
  # SBX_AGENTS_DIR: /c/Users/me/agents
  # SBX_TOOL_SRC: /c/Users/me/src/mytool

sandboxOptions:
  cpus: 4
  memory: 8g
  skills: readonly
