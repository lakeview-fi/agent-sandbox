# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config: { runtime: { allow: [api.anthropic.com, platform.claude.com] } }
  # Claude-subscription OAuth held by the sbx proxy (stored by the built-in claude login, service anthropic).
  # The guest gets only sentinel tokens in pi's own auth file; the proxy swaps in the real token on egress.
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      oauth:
        tokenEndpoint: { host: platform.claude.com, path: /v1/oauth/token }
        resourceHosts: [api.anthropic.com]
        sentinels: { accessToken: sk-ant-oat01-proxy-managed, refreshToken: sk-ant-ort01-proxy-managed }
        credentialFile:
          path: /home/agent/.pi/agent/auth.json
          structure:
            anthropic: { type: oauth, access: "{{.AccessToken}}", refresh: "{{.RefreshToken}}", expires: "{{.ExpiresAt}}" }
